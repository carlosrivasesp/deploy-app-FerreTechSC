<div class="register-container">

    <div class="col-md-5 col-lg-4">

        <div class="card register-card">

            <div class="register-header text-center">

                <h3>

                    Crear Cuenta

                </h3>

            </div>

            <div class="card-body register-body">

                <form
                    [formGroup]="form"
                    (ngSubmit)="registrar()">

                    <div class="mb-3">

                        <label>

                            Correo Electrónico

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            formControlName="correo">

                    </div>

                    <div class="mb-3">

                        <label>

                            Contraseña

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            formControlName="password">

                    </div>

                    <button
                        class="btn btn-register w-100"
                        type="submit">

                        Registrarme

                    </button>

                </form>

            </div>

            <div class="register-footer text-center">

                ¿Ya tienes una cuenta?

                <a routerLink="/login">

                    Inicia sesión

                </a>

            </div>

        </div>

    </div>

</div>
